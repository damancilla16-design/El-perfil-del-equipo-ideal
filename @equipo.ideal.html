<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>@equipo.ideal</title>
<style>
:root{--v:#22a45d;--vo:#178048;--bd:#dbdbdb;--mut:#737373;--tx:#1a1a1a}
*{box-sizing:border-box;margin:0}
html{color-scheme:light}
body{background:#fafafa;color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:max(20px,env(safe-area-inset-top)) 16px 40px}
.wrap{max-width:820px;margin:0 auto}
.top{display:flex;gap:clamp(20px,6vw,70px);align-items:flex-start;flex-wrap:wrap;justify-content:center}
.ring{width:clamp(96px,22vw,150px);aspect-ratio:1;border-radius:50%;padding:4px;background:conic-gradient(#22a45d,#b5e48c,#f0a30f,#22a45d);flex:none}
.ring svg{width:100%;height:100%;border-radius:50%;border:4px solid #fff;display:block}
.inf{flex:1;min-width:250px}
.r1{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:1.35rem;font-weight:400;margin-right:6px}
.b{border:0;border-radius:8px;padding:7px 18px;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;background:var(--v);color:#fff}
.b.s{background:#efefef;color:var(--tx)}
.st{display:flex;gap:28px;margin-bottom:14px;flex-wrap:wrap}
.nm{font-weight:700}.bio{white-space:pre-line;line-height:1.45;margin-top:2px}
.lk{color:#00376b;font-weight:600}
.hls{display:flex;gap:clamp(14px,4vw,34px);justify-content:center;margin:32px 0 6px;flex-wrap:wrap}
.hl{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;font-size:.78rem;font-weight:600;color:var(--mut)}
.hl i{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;font-style:normal;background:#fff;border:2px solid var(--bd);transition:.25s}
.hl.on{color:var(--tx)}.hl.on i{border-color:var(--v);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--v)}
.sep{border-top:1px solid var(--bd);margin:18px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{aspect-ratio:1;border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;transition:.25s}
.card:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 8px 20px rgba(0,0,0,.1)}
.card span{font-size:2.2rem}.card small{color:#444;font-size:.78rem;line-height:1.3}
.c0{background:#e6f6ed}.c1{background:#fff3d6}.c2{background:#e3f0fb}.c3{background:#fde6e2}
.an{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:22px}
.big{font-size:3rem;font-weight:800;color:var(--v);line-height:1}
.chips{display:flex;flex-direction:column;gap:6px;margin:14px 0 6px}
.chips p{background:#f4f4f4;border-radius:10px;padding:9px 12px;font-size:.92rem}
h3{margin:22px 0 10px;font-size:1rem}
.rw{margin-bottom:14px}.rt{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:5px;gap:8px}
.rt b{color:var(--mut);font-weight:600;font-size:.8rem;text-align:right}
.trk{height:10px;background:#e8ece9;border-radius:9px;overflow:hidden}
.trk i{display:block;height:100%;border-radius:9px;transition:width .3s}
input[type=range]{width:100%;accent-color:var(--v);margin-top:4px}
.n{color:var(--mut);font-size:.82rem;margin-top:4px}
</style></head><body><div class="wrap">
<header class="top">
<div class="ring"><svg viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d27b"/><stop offset="1" stop-color="#0f7a43"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#g)"/><g fill="#fff"><circle cx="50" cy="36" r="11"/><path d="M29 80a21 18 0 0 1 42 0z"/><g opacity=".7"><circle cx="24" cy="46" r="8"/><path d="M8 80a16 14 0 0 1 28-10v10z"/><circle cx="76" cy="46" r="8"/><path d="M92 80a16 14 0 0 0-28-10v10z"/></g></g></svg></div>
<div class="inf">
<div class="r1"><h1>equipo.ideal</h1><button class="b" id="fb" onclick="fol()">Seguir</button><button class="b s" onclick="show(4)">Ideal vs Real</button></div>
<div class="st"><span><b>5</b> valores</span><span><b id="fl">248</b> seguidores</span><span><b>10</b> metas</span></div>
<p class="nm">Equipo Ideal ✨</p>
<p class="bio">Aprendemos juntos 💡 Cumplimos lo que prometemos ✅
Código limpio, ideas claras y buena energía 🚀
Aquí nadie se queda atrás 🤝</p>
<p class="lk">#EquipoIdeal #TrabajoEnEquipo</p>
</div></header>
<div class="hls" id="hls"></div><div class="sep"></div>
<main id="ct"></main></div>
<script>
const V=[['🤝','Respeto','Valoramos cada opinión y a cada persona.'],['✅','Responsabilidad','Si lo prometemos, lo cumplimos.'],['💬','Comunicación','Claros, honestos y a tiempo.'],['🧩','Colaboración','Ganamos juntos, no por separado.'],['🔥','Compromiso','Damos el 100% en cada proyecto.']];
const B=[['⏰','Puntualidad','Llegamos a tiempo a reuniones y entregas.',70],['📦','Cumple entregas','Nada se queda para última hora.',60],['👂','Escucha activa','Escuchamos antes de opinar.',65],['🙋','Pide ayuda','Preguntar no da miedo.',50],['⚖️','Reparto equitativo','Todos aportan por igual.',55]];
const S=[['🧠','Resolver problemas','Buscamos soluciones, no culpables.',70],['💻','Programación','HTML, CSS y JavaScript al día.',65],['🗣️','Comunicación','Explicamos ideas con claridad.',60],['📅','Gestión del tiempo','Planeamos y priorizamos.',45],['🔄','Adaptabilidad','Nos ajustamos a los cambios.',75]];
const H=[['🏆','Hackatones'],['🎮','Videojuegos'],['🎬','Cine y series'],['⚽','Fútbol'],['🎧','Música'],['☕','Café']];
const T=[['🤝','Valores'],['👣','Comportamientos'],['💪','Habilidades'],['🎉','Hobbies'],['📊','Ideal vs Real']];
const A=B.concat(S);let real=A.map(x=>x[3]);
try{const s=JSON.parse(localStorage.getItem('eqreal'));if(s&&s.length==10)real=s}catch(e){}
const col=p=>p>=75?'#22a45d':p>=50?'#f0a30f':'#e5604d';
const card=(a,k)=>`<div class="card c${k%4}"><span>${a[0]}</span><b>${a[1]}</b><small>${a[2]||''}</small></div>`;
const g=l=>`<div class="grid">${l.map(card).join('')}</div>`;
function show(k){
document.getElementById('hls').innerHTML=T.map((t,j)=>`<button class="hl ${j==k?'on':''}" onclick="show(${j})"><i>${t[0]}</i>${t[1]}</button>`).join('');
const c=document.getElementById('ct');
if(k<4){c.innerHTML=g([V,B,S,H][k]);return}
c.innerHTML=`<div class="an"><div id="sm"></div>`+A.map((a,j)=>`${j==0?'<h3>👣 Comportamientos</h3>':j==5?'<h3>💪 Habilidades</h3>':''}<div class="rw"><div class="rt"><span>${a[0]} ${a[1]}</span><b id="p${j}"></b></div><div class="trk"><i id="b${j}"></i></div><input type="range" min="0" max="100" step="5" value="${real[j]}" oninput="setR(${j},+this.value)"></div>`).join('')+`<p class="n">La barra llena es el ideal (100%). Mueve cada control según cómo está realmente tu equipo.</p></div>`;
upd()}
function upd(){
if(!document.getElementById('sm'))return;
A.forEach((a,j)=>{p=document.getElementById('p'+j);b=document.getElementById('b'+j);p.textContent=`Real ${real[j]}% · brecha ${100-real[j]}`;b.style.width=real[j]+'%';b.style.background=col(real[j])});
const avg=Math.round(real.reduce((x,y)=>x+y,0)/real.length),mn=real.indexOf(Math.min(...real)),mx=real.indexOf(Math.max(...real));
const lv=avg>=80?'¡Casi equipo ideal! 🏆':avg>=60?'Buen camino, aún hay brechas 💪':'Hay mucho por mejorar 🌱';
document.getElementById('sm').innerHTML=`<div class="big">${avg}%</div><p><b>de alineación con el equipo ideal</b></p><p class="n">${lv}</p><div class="chips"><p>🔴 Mayor brecha: <b>${A[mn][1]}</b> (−${100-real[mn]})</p><p>🟢 Mayor fortaleza: <b>${A[mx][1]}</b> (${real[mx]}%)</p><p>💡 Acción: fijen una meta semanal para <b>${A[mn][1]}</b>.</p></div>`}
function setR(j,v){real[j]=v;try{localStorage.setItem('eqreal',JSON.stringify(real))}catch(e){}upd()}
let f=0;function fol(){f=!f;fb.textContent=f?'Siguiendo ✓':'Seguir';fb.className=f?'b s':'b';fl.textContent=f?249:248}
show(0);
</script></body></html>
